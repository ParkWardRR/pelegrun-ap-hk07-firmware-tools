name: release

# On a version tag, cross-compile the artifacts and attach them (with checksums)
# to the GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so `git describe` sees the tag
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: mlugg/setup-zig@v2
        with: { version: "0.16.0" }

      - name: Build dist artifacts
        run: ./scripts/dist.sh "${GITHUB_REF_NAME}"

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/swallow-*
            dist/lure-*
            dist/quarry-*
            dist/SHA256SUMS
