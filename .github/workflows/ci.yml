name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --workspace --verbose
      - run: cargo build --release --workspace
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
  zig:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: zig } }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: '0.16.0' }
      - run: zig build
      - run: ./tftp_test.sh  # lure TFTP responder: real multi-block transfer round-trip
